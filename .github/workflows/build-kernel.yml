name: Build CachyOS Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "linux-x0rzavi.toml"
      - "modprobed.db"

jobs:
  build-cachyos-kernel:
    runs-on: ubuntu-latest
    # Using the exact same image the official CachyOS script.sh uses
    container:
      image: pttrr/docker-makepkg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python (if not present in the image)
        run: sudo pacman -S --noconfirm python

      - name: Setup modprobed.db for localmodconfig
        run: |
          # The pttrr/docker-makepkg image uses the 'notroot' user
          mkdir -p /home/notroot/.config
          cp modprobed.db /home/notroot/.config/modprobed.db
          sudo chown -R notroot:notroot /home/notroot/.config

      - name: Clone CachyOS PKGBUILD repository
        run: |
          git clone https://github.com/cachyos/linux-cachyos.git pkgbuilds
          cd pkgbuilds
          git checkout --force master
          git clean -fd

      - name: Parse TOML and Generate Environment
        run: |
          cat << 'EOF' > parse_config.py
          import tomllib

          with open('linux-x0rzavi.toml', 'rb') as f:
              config = tomllib.load(f)

          mapping = {
              "cachy_config_check": "_cachy_config",
              "nconfig_check": "_makenconfig",
              "xconfig_check": "_makexconfig",
              "localmodcfg_check": "_localmodcfg",
              "use_current_check": "_use_current",
              "hardly_check": "_cc_harder",
              "per_gov_check": "_per_gov",
              "tcp_bbr3_check": "_tcp_bbr3",
              "hz_ticks_combo": "_HZ_ticks",
              "tickrate_combo": "_tickrate",
              "preempt_combo": "_preempt",
              "hugepage_combo": "_hugepage",
              "cpu_opt_combo": "_processor_opt",
              "lto_combo": "_use_llvm_lto",
              "builtin_zfs_check": "_build_zfs",
              "builtin_nvidia_open_check": "_build_nvidia_open",
              "build_debug_check": "_build_debug"
          }

          with open('/home/notroot/build_env.sh', 'w') as out:
              for toml_key, env_var in mapping.items():
                  if toml_key in config:
                      val = config[toml_key]
                      if type(val) is bool:
                          if val:
                              out.write(f"export {env_var}='y'\n")
                      else:
                          if toml_key == "cpu_opt_combo" and val == "native":
                              val = "znver1"
                          out.write(f"export {env_var}='{val}'\n")

              if "custom_name_edit" in config:
                  name = config["custom_name_edit"].replace("$pkgbase", "linux-cachyos")
                  out.write(f"export CUSTOM_PKGBASE='{name}'\n")
          EOF

          python parse_config.py
          sudo chown notroot:notroot /home/notroot/build_env.sh

          echo "Generated Build Environment:"
          cat /home/notroot/build_env.sh

      - name: Setup environment and apply custom name
        run: |
          source /home/notroot/build_env.sh
          sed -i "s/^pkgbase=.*/pkgbase=\"$CUSTOM_PKGBASE\"/" pkgbuilds/linux-cachyos/PKGBUILD
          sudo chown -R notroot:notroot pkgbuilds

      - name: Build the kernel (makepkg)
        run: |
          # Since the container already runs as 'notroot', we just source the env and build
          source /home/notroot/build_env.sh
          cd pkgbuilds/linux-cachyos

          # We use --noconfirm so pacman dependency installation doesn't hang on [Y/n]
          makepkg -scf --noconfirm --cleanbuild --skipchecksums

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-cachyos-x0rzavi-packages
          # Note: makepkg in docker-makepkg is configured via makepkg.conf
          # to output packages to /home/notroot/packages by default, OR
          # it drops them in the local directory. Let's capture both to be safe.
          path: |
            pkgbuilds/linux-cachyos/*.pkg.tar.zst
            /home/notroot/packages/*.pkg.tar.zst
          if-no-files-found: error
