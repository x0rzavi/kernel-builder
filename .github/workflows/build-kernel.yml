name: Build CachyOS Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "linux-x0rzavi.toml"
      - "modprobed.db"

jobs:
  build-cachyos-kernel:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write

    env:
      CCACHE_DIR: /home/builder/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Transform Vanilla Arch into CachyOS (v3)
        run: |
          curl https://mirror.cachyos.org/cachyos-repo.tar.xz -o cachyos-repo.tar.xz
          tar xvf cachyos-repo.tar.xz && cd cachyos-repo

          pacman-key --init
          sed -i 's/\bpacman -/pacman --noconfirm -/g' cachyos-repo.sh
          ./cachyos-repo.sh

      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed ccache python git sudo github-cli

          # Setup builder user
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # Optimize makepkg.conf for GitHub Actions
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf

          # Prepare user directories
          sudo -u builder mkdir -p ${{ env.CCACHE_DIR }} /home/builder/.config

      - name: Setup ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kernel-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-

      - name: Setup modprobed.db for localmodconfig
        run: |
          cp modprobed.db /home/builder/.config/modprobed.db
          chown -R builder:builder /home/builder/.config

      - name: Clone CachyOS PKGBUILD repository
        run: |
          git clone https://github.com/cachyos/linux-cachyos.git pkgbuilds
          cd pkgbuilds
          git checkout --force master
          git clean -fd

      - name: Parse TOML and Generate Environment
        run: |
          cat << 'EOF' > parse_config.py
          import tomllib

          with open('linux-x0rzavi.toml', 'rb') as f:
              config = tomllib.load(f)

          mapping = {
              "cachy_config_check": "_cachy_config",
              "nconfig_check": "_makenconfig",
              "xconfig_check": "_makexconfig",
              "localmodcfg_check": "_localmodcfg",
              "use_current_check": "_use_current",
              "hardly_check": "_cc_harder",
              "per_gov_check": "_per_gov",
              "tcp_bbr3_check": "_tcp_bbr3",
              "hz_ticks_combo": "_HZ_ticks",
              "tickrate_combo": "_tickrate",
              "preempt_combo": "_preempt",
              "hugepage_combo": "_hugepage",
              "cpu_opt_combo": "_processor_opt",
              "lto_combo": "_use_llvm_lto",
              "builtin_zfs_check": "_build_zfs",
              "builtin_nvidia_open_check": "_build_nvidia_open",
              "build_debug_check": "_build_debug"
          }

          with open('/home/builder/build_env.sh', 'w') as out:
              for toml_key, env_var in mapping.items():
                  if toml_key in config:
                      val = config[toml_key]
                      if type(val) is bool:
                          if val:
                              out.write(f"export {env_var}='yes'\n")
                      else:
                          if toml_key == "cpu_opt_combo" and val == "native":
                              val = "generic_v3"
                          out.write(f"export {env_var}='{val}'\n")

              if "custom_name_edit" in config:
                  name = config["custom_name_edit"].replace("$pkgbase", "linux-cachyos")
                  out.write(f"export CUSTOM_PKGBASE='{name}'\n")
          EOF

          python parse_config.py
          chown builder:builder /home/builder/build_env.sh

          echo "Generated Build Environment:"
          cat /home/builder/build_env.sh

      - name: Setup environment and apply custom name
        run: |
          source /home/builder/build_env.sh
          sed -i "s/^pkgbase=.*/pkgbase=\"$CUSTOM_PKGBASE\"/" pkgbuilds/linux-cachyos/PKGBUILD

          # Inject the GitHub Run Number as the pkgrel so pacman always sees new builds as updates
          sed -i "s/^pkgrel=.*/pkgrel=${{ github.run_number }}/" pkgbuilds/linux-cachyos/PKGBUILD

          chown -R builder:builder pkgbuilds

      # - name: Prepare build environment and verify with a test compile
      #   run: |
      #     su - builder -c "
      #       # Source environment to ensure _processor_opt='generic_v1' is active
      #       source /home/builder/build_env.sh
      #
      #       export KCFLAGS=' -march=znver1'
      #       export KCPPFLAGS=' -march=znver1'
      #       export KBUILD_RUSTFLAGS=' -Ctarget-cpu=znver1'
      #
      #       cd $PWD/pkgbuilds/linux-cachyos
      #
      #       echo '=== Step 1: Downloading, extracting, and configuring kernel sources ==='
      #       makepkg --syncdeps --noconfirm --nobuild
      #
      #       echo '=== Step 2: Locating the extracted kernel source tree ==='
      #       SRCDIR=\$(dirname \$(find src/ -maxdepth 2 -name Makefile | head -n 1))
      #       echo \"Kernel source directory: \$SRCDIR\"
      #       cd \"\$SRCDIR\"
      #
      #       echo '=== Step 3: Compiling lib/find_bit.o using the kernel make setup ==='
      #       make lib/find_bit.o V=1
      #
      #       echo '=== Step 4: Confirming applied flags in the hidden .cmd track-file ==='
      #       if [ -f lib/.find_bit.o.cmd ]; then
      #         echo 'Command line flags verified:'
      #         grep -o 'march=[a-zA-Z0-9-]*' lib/.find_bit.o.cmd
      #         cat lib/.find_bit.o.cmd
      #       else
      #         echo 'Tracking file lib/.find_bit.o.cmd missing'
      #       fi
      #     "

      - name: Build the kernel (makepkg)
        run: |
          # TODO: verify if actually znver1 optimized
          su - builder -s /bin/bash <<'EOF'
            set -euo pipefail
            source /home/builder/build_env.sh

            export KCFLAGS="-march=znver1"
            export KCPPFLAGS="-march=znver1"
            export KBUILD_RUSTFLAGS="-Ctarget-cpu=znver1"

            cd "$PWD/pkgbuilds/linux-cachyos"

            # Apply PGP key for verification
            shopt -s nullglob
            asc_files=( ./*.asc )
            ((${#asc_files[@]})) || { echo "No .asc files found" >&2; exit 1; }

            gpg --import "${asc_files[@]}"

            # This will now perfectly resolve dependencies using the v3 CachyOS toolchain!
            makepkg --skipchecksums --syncdeps --noconfirm --cleanbuild
          EOF
          "

      - name: Create Pacman Repository Database
        run: |
          cd pkgbuilds/linux-cachyos
          # Create a fresh database containing the newly built packages
          repo-add -n -R x0rzavi.db.tar.gz *.pkg.tar.zst

          # repo-add creates symlinks for .db and .files, but GitHub Releases 
          # needs the actual files. We remove the symlinks first, then copy.
          rm -f x0rzavi.db x0rzavi.files
          cp x0rzavi.db.tar.gz x0rzavi.db
          cp x0rzavi.files.tar.gz x0rzavi.files

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the old release and tag so we only keep the latest kernel
          gh release delete znver1 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

          # Create a new release with the packages and database
          gh release create znver1 \
            --repo "$GITHUB_REPOSITORY" \
            pkgbuilds/linux-cachyos/*.pkg.tar.zst \
            pkgbuilds/linux-cachyos/x0rzavi.db \
            pkgbuilds/linux-cachyos/x0rzavi.files \
            --title "x0rzavi Custom Kernel Repository" \
            --notes "Automated kernel build"
