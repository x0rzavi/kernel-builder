name: Build CachyOS Kernel

on:
  workflow_dispatch:
  push:
    paths:
      - "linux-x0rzavi.toml"
      - "modprobed.db"

jobs:
  build-cachyos-kernel:
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    env:
      CCACHE_DIR: /home/builder/.ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          # 1. Use CachyOS V3 repositories (Injecting them ABOVE default Arch repos for priority)
          awk '/^\[core\]/ {
            print "[cachyos-v3]"
            print "Server = https://mirror.cachyos.org/repo/x86_64-v3/cachyos-v3"
            print "[cachyos-core-v3]"
            print "Server = https://mirror.cachyos.org/repo/x86_64-v3/cachyos-core-v3"
            print "[cachyos-extra-v3]"
            print "Server = https://mirror.cachyos.org/repo/x86_64-v3/cachyos-extra-v3"
            print "[cachyos]"
            print "Server = https://mirror.cachyos.org/repo/x86_64/cachyos"
          } 1' /etc/pacman.conf > /tmp/pacman.conf && mv /tmp/pacman.conf /etc/pacman.conf

          # 2. Add CachyOS keyring
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47

          # 3. Install required tools (will now pull v3-optimized clang, ccache, etc.)
          pacman -Syu --noconfirm --needed ccache python git sudo

          # 4. Setup builder user
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

          # 5. Optimize makepkg.conf for GitHub Actions
          sed -i 's/#MAKEFLAGS="-j2"/MAKEFLAGS="-j$(nproc) -l$(nproc)"/g' /etc/makepkg.conf
          sed -i 's|!ccache|ccache|' /etc/makepkg.conf

          # 6. Prepare user directories
          sudo -u builder mkdir -p ${{ env.CCACHE_DIR }} /home/builder/.config

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-kernel-${{ github.run_id }}
          restore-keys: |
            ccache-kernel-

      - name: Setup modprobed.db for localmodconfig
        run: |
          cp modprobed.db /home/builder/.config/modprobed.db
          chown -R builder:builder /home/builder/.config

      - name: Clone CachyOS PKGBUILD repository
        run: |
          git clone https://github.com/cachyos/linux-cachyos.git pkgbuilds
          cd pkgbuilds
          git checkout --force master
          git clean -fd

      - name: Parse TOML and Generate Environment
        run: |
          cat << 'EOF' > parse_config.py
          import tomllib

          with open('linux-x0rzavi.toml', 'rb') as f:
              config = tomllib.load(f)

          mapping = {
              "cachy_config_check": "_cachy_config",
              "nconfig_check": "_makenconfig",
              "xconfig_check": "_makexconfig",
              "localmodcfg_check": "_localmodcfg",
              "use_current_check": "_use_current",
              "hardly_check": "_cc_harder",
              "per_gov_check": "_per_gov",
              "tcp_bbr3_check": "_tcp_bbr3",
              "hz_ticks_combo": "_HZ_ticks",
              "tickrate_combo": "_tickrate",
              "preempt_combo": "_preempt",
              "hugepage_combo": "_hugepage",
              "cpu_opt_combo": "_processor_opt",
              "lto_combo": "_use_llvm_lto",
              "builtin_zfs_check": "_build_zfs",
              "builtin_nvidia_open_check": "_build_nvidia_open",
              "build_debug_check": "_build_debug"
          }

          with open('/home/builder/build_env.sh', 'w') as out:
              for toml_key, env_var in mapping.items():
                  if toml_key in config:
                      val = config[toml_key]
                      if type(val) is bool:
                          if val:
                              # Official GH actions uses 'yes' rather than 'y'
                              out.write(f"export {env_var}='yes'\n")
                      else:
                          if toml_key == "cpu_opt_combo" and val == "native":
                              val = "znver1"
                          out.write(f"export {env_var}='{val}'\n")

              if "custom_name_edit" in config:
                  name = config["custom_name_edit"].replace("$pkgbase", "linux-cachyos")
                  out.write(f"export CUSTOM_PKGBASE='{name}'\n")
          EOF

          python parse_config.py
          chown builder:builder /home/builder/build_env.sh

          echo "Generated Build Environment:"
          cat /home/builder/build_env.sh

      - name: Setup environment and apply custom name
        run: |
          source /home/builder/build_env.sh
          sed -i "s/^pkgbase=.*/pkgbase=\"$CUSTOM_PKGBASE\"/" pkgbuilds/linux-cachyos/PKGBUILD
          chown -R builder:builder pkgbuilds

      - name: Build the kernel (makepkg)
        run: |
          # Use the exact sudo execution method from the official Action
          # --syncdeps resolves dependencies automatically using the CachyOS repo we added!
          su - builder -c "
            source /home/builder/build_env.sh
            cd $PWD/pkgbuilds/linux-cachyos
            makepkg --skipchecksums --syncdeps --noconfirm --cleanbuild
          "

      - name: Upload Kernel Packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-cachyos-x0rzavi-packages
          path: pkgbuilds/linux-cachyos/*.pkg.tar.zst*
          if-no-files-found: error
